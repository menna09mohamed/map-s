<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متحف مصر في عهد خلفاء محمد علي</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6eedc;--bg2:#fbf6ea;--paper:#fffaf0;--ink:#3b2a1c;--gold:#c9a24b;--gold2:#e6c878;--olive:#5b6b3a;--nile:#2f5d7c;--red:#9a3b2e;--ok:#4f7a35;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:repeating-linear-gradient(90deg,transparent 0 78px,rgba(201,162,75,.07) 78px 80px);color:var(--paper);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,serif;line-height:1.9;font-size:18px}
h1,h2,h3{font-family:"Reem Kufi","Noto Naskh Arabic",serif;margin:.3em 0;color:var(--gold2)}
main{max-width:980px;margin:auto;padding:12px 14px 60px}
.btn{font:inherit;font-weight:700;background:var(--gold);color:#2a1d10;border:0;border-radius:10px;padding:8px 20px;cursor:pointer;border-bottom:4px solid #8d6e27}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:transparent;color:var(--gold2);border:2px solid var(--gold)}
.btn:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid #fff;outline-offset:2px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;background:var(--bg2);border:1px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:12px;font-size:15px;text-align:center}
.dash b{display:block;color:var(--gold2);font-size:20px}
.bar{height:12px;background:#0006;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--gold));transition:width .6s}
.hero{text-align:center;padding:28px 10px;border:3px double var(--gold);border-radius:14px 14px 0 0;background:linear-gradient(var(--bg2),var(--bg))}
.hero h1{font-size:clamp(26px,6vw,46px)}
.guide{display:flex;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 14px;margin:14px 0;border-right:8px solid var(--gold)}
.guide span{font-size:46px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.door{background:var(--paper);color:var(--ink);border:4px solid var(--gold);border-radius:90px 90px 10px 10px;padding:22px 14px 14px;text-align:center;position:relative;min-height:190px}
.door.lock{filter:grayscale(.8) brightness(.7)}.door.cur{box-shadow:0 0 28px 6px var(--gold2)}.door.done{border-color:var(--ok)}
.door .ic{font-size:44px}.door h3{color:var(--ink);font-size:22px}
.tag{display:inline-block;border-radius:20px;padding:0 12px;font-size:15px;color:#fff;background:var(--nile)}.done .tag{background:var(--ok)}.lock .tag{background:#555}
.panel{background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 18px;margin:14px 0;border:2px solid var(--gold)}
.panel h2,.panel h3{color:var(--brown,#5a3b1a)}
.panel ul{padding-inline-start:22px;margin:.3em 0}.panel li{margin:.3em 0}
.panel b{background:#c9a24b55;border-radius:4px;padding:0 4px}
.warn{background:#fff3;border-right:6px solid #e0a030;padding:6px 12px;border-radius:8px;font-size:16px;color:inherit}
.panel .warn{color:var(--ink);background:#e0a03033}
.tl{border-right:4px solid var(--gold);margin:10px 8px 0 0;padding-right:16px}.tl div{position:relative;margin:8px 0}
.tl div:before{content:"";position:absolute;right:-26px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--nile);border:3px solid var(--gold)}
.tl strong{color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{display:block;border:2px solid #8d6e27;border-radius:10px;padding:6px 12px;margin:8px 0;cursor:pointer;background:#fff6}
.opt.ok{background:#4f7a3544;border-color:var(--ok)}.opt.no{background:#9a3b2e33;border-color:var(--red)}
.fb{border-radius:10px;padding:8px 14px;margin:10px 0;font-weight:700}.fb.ok{background:#4f7a3533}.fb.no{background:#9a3b2e22}
.ring{width:190px;height:190px;margin:auto;display:block}
.cert{border:8px double var(--gold);background:var(--paper);color:var(--ink);text-align:center;padding:26px;border-radius:10px;margin:16px 0}
.cert h2{color:var(--red);font-size:34px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
input[type=text]{font:inherit;padding:8px 14px;border-radius:10px;border:2px solid var(--gold);min-width:240px;max-width:100%}
@media print{body{background:#fff}main>*:not(#cert){display:none!important}#cert{display:block!important;margin:0}.cert{border-color:#8d6e27}}

body{background-color:#33202a;background-image:radial-gradient(circle at 50% 0,#5a3342 0,transparent 60%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(201,162,75,.06) 22px 24px),repeating-linear-gradient(-45deg,transparent 0 22px,rgba(201,162,75,.06) 22px 24px);padding-bottom:70px}
body:before{content:"";position:fixed;inset:0 0 auto;height:14px;background:linear-gradient(#e6c878,#8d6e27);z-index:5;box-shadow:0 4px 10px #0008}
body:after{content:"";position:fixed;inset:auto 0 0;height:46px;background:repeating-conic-gradient(#efe6d3 0 25%,#6b5b4a 0 50%) 0 0/46px 46px;border-top:6px solid #c9a24b;z-index:5;box-shadow:0 -6px 14px #0008}
main{border-inline:2px solid #c9a24b55;background:linear-gradient(90deg,#0003,transparent 8%,transparent 92%,#0003)}
.hero{position:relative;background:linear-gradient(#0000,#0006),radial-gradient(ellipse at 50% 0,#c9a24b55,transparent 70%);border-radius:6px}
.hero:before,.hero:after{content:"";position:absolute;top:0;bottom:0;width:34px;background:linear-gradient(90deg,#8d6e27,#f0dc9c 40%,#8d6e27);border-radius:4px;opacity:.9}
.hero:before{right:8px}.hero:after{left:8px}
.hero>*{position:relative;z-index:1}
.frame{width:200px;height:260px;margin:10px auto;border:16px solid #b8903a;border-image:linear-gradient(135deg,#f0dc9c,#8d6e27,#f0dc9c,#8d6e27) 1;box-shadow:0 0 0 4px #5a3b1a,inset 0 0 18px #000a,0 14px 30px #000a;background:#e8dcc0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:70px;position:relative}
.frame img{width:100%;height:100%;object-fit:cover;filter:sepia(.35)}
.frame.sm{width:120px;height:150px;border-width:10px;font-size:44px;margin:0 auto 6px}
.plaque{display:inline-block;background:linear-gradient(#e6c878,#a8842f);color:#2a1d10;border-radius:4px;padding:2px 18px;font-weight:700;box-shadow:0 2px 6px #000a;border:1px solid #6b5014}
.door{border-radius:80px 80px 6px 6px;background:linear-gradient(#f3e8d0,#e0cfa8)}
.door.lock:after{content:"⛔ الطريق مغلق";position:absolute;left:10%;right:10%;top:52%;background:#8a1f2b;color:#fff;border-radius:20px;padding:0 8px;font-size:15px;box-shadow:0 3px 6px #000a;transform:rotate(-4deg)}
.up{display:inline-block;margin:4px}
.up input{display:none}
@media print{body:before,body:after{display:none}main{border:0;background:none}}
@keyframes dooropen{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}#app.enter{animation:dooropen .8s ease}@media (prefers-reduced-motion:reduce){#app.enter{animation:none}}

body{color:var(--ink);background-color:#f6eedc;background-image:radial-gradient(circle at 50% 0,#fffdf6 0,transparent 65%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(201,162,75,.12) 22px 24px),repeating-linear-gradient(-45deg,transparent 0 22px,rgba(201,162,75,.12) 22px 24px)}
body:before{box-shadow:0 3px 8px #0003}
body:after{background:repeating-conic-gradient(#fffaf0 0 25%,#d8c8a6 0 50%) 0 0/46px 46px;box-shadow:0 -4px 10px #0002}
main{background:linear-gradient(90deg,#c9a24b22,transparent 8%,transparent 92%,#c9a24b22)}
h1,h2,h3{color:#7a5a18}
.hero{background:linear-gradient(#fff0,#c9a24b1f),radial-gradient(ellipse at 50% 0,#fff8e0,transparent 75%);border-color:#c9a24b}
.hero:before,.hero:after{opacity:.75}
.btn.alt{color:#6b4c12;border-color:#b8903a;background:#fffaf0}
.dash{border-color:#c9a24b;box-shadow:0 2px 8px #8d6e2733}.dash b{color:#8a5a12}
.panel,.door,.guide{box-shadow:0 3px 10px #8d6e2733}
.panel{background:#fffdf7}
.panel h2,.panel h3{color:#7a5a18}
.panel b{background:#e6c87866}
.warn{background:#e6c87855}
.bar{background:#c9a24b33}
.door{background:linear-gradient(#fffdf7,#f1e4c4)}
.door.lock{filter:grayscale(.5) brightness(.95);opacity:.8}
.door.cur{box-shadow:0 0 24px 4px #e6c878}
.opt{background:#fffdf7}
.frame{box-shadow:0 0 0 4px #c9a24b,inset 0 0 14px #0006,0 10px 22px #8d6e2755}
.cert{background:#fffdf7}
.tl strong{color:#9a3b2e}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* محتوى الغرف: مأخوذ من صفحات الدرس المرفقة فقط */
var R=[
{n:"عباس حلمي الأول",per:"١٨٤٨م – ١٨٥٤م",ic:"🏛️",
intro:"هو عباس بن طوسون بن «محمد علي». تولى حكم مصر خلفًا لعمه إبراهيم باشا، ولم تتجاوز فترة حكمه ست سنوات.",
secs:[["المواصلات والتجارة (مميزات حكمه)",["أصلح <b>الطريق البري</b> بين القاهرة والسويس.","بدأ في تنفيذ مشروع مد <b>خط سكة حديد</b> بين القاهرة والإسكندرية.","بدأ في مد <b>الخطوط التلغرافية</b>.","كانت تلك الإصلاحات بهدف <b>تسهيل حركة التجارة</b>."]],
["مساوئ حكمه: الرجعية والجمود",["أغلق معظم <b>المدارس والمصانع</b> التي أنشأها «محمد علي».","استدعى <b>البعثات العلمية</b> من فرنسا.","أهمل <b>الجيش والبحرية</b>."]]],
tl:[["١٨٤٨م","تولى عباس حلمي الأول الحكم خلفًا لعمه إبراهيم باشا"],["١٨٥٤م","انتهاء حكمه بعد ست سنوات"]],
qs:[["من والد عباس حلمي الأول؟",["طوسون بن محمد علي","إبراهيم بن محمد علي","سعيد بن محمد علي","إسماعيل بن إبراهيم"],0,"هو عباس بن طوسون بن «محمد علي»."],
["كم بلغت مدة حكم عباس حلمي الأول؟",["سنة واحدة","ثلاث سنوات","ست سنوات","عشرون سنة"],2,"لم تتجاوز فترة حكمه ست سنوات."],
["أي المشروعات الآتية بدأه عباس حلمي الأول بهدف تسهيل التجارة؟",["حفر ترعة الإسماعيلية","سكة حديد القاهرة – الإسكندرية","بناء دار الأوبرا","تأسيس صندوق الدين"],1,"بدأ في تنفيذ مشروع مد خط سكة حديد بين القاهرة والإسكندرية، وكان ذلك لتسهيل حركة التجارة."],
["أي الإجراءات الآتية دليل على رجعية حكمه وجموده؟",["إصلاح الطريق بين القاهرة والسويس","مد الخطوط التلغرافية","إغلاق معظم المدارس والمصانع","البدء في السكة الحديد"],2,"أغلق معظم المدارس والمصانع التي أنشأها «محمد علي»، أما الباقي فمن إصلاحاته."],
["لماذا يُعد إغلاق المدارس والمصانع وإهمال الجيش والبحرية تراجعًا عن نهضة محمد علي؟",["لأنها أنهت ما أقامه محمد علي من مؤسسات التعليم والصناعة والقوة العسكرية","لأنها زادت عدد البعثات","لأنها وسعت الخطوط التلغرافية","لأنها زادت مساحة الأراضي"],0,"المدارس والمصانع والجيش والبحرية من أسس الدولة التي بناها «محمد علي»، فإغلاقها وإهمالها تراجع عنها."]]},
{n:"محمد سعيد باشا",per:"١٨٥٤م – ١٨٦٣م",ic:"⛵",
intro:"هو محمد سعيد بن «محمد علي». تولى حكم مصر بعد وفاة عباس حلمي الأول باشا.",
secs:[["الزراعة",["أصدر <b>اللائحة السعيدية</b>: أصبح الفلاح مالكًا للأرض لأبنائه، وحرًا في تصريف محاصيله الزراعية، وله حق التوريث.","خفف الضرائب وتجاوز عن المتأخر منها.","اهتم بتطهير <b>ترعة المحمودية</b> التي حُفرت في عهد «محمد علي»."]],
["التجارة",["اهتم بشركات <b>الملاحة النهرية والبحرية</b>، فأنشأ شركة لنقل المحاصيل الزراعية والمسافرين عن طريق نهر النيل.","وأنشأ شركة لتسيير البواخر في البحرين المتوسط والأحمر."]],
["السكك الحديدية والتلغرافات",["استكمل خط السكة الحديدية بين القاهرة والإسكندرية (الذي بدأه عباس حلمي الأول).","مد خط سكة حديدية بين القاهرة والسويس.","مد الخطوط التلغرافية بين الإسكندرية والقاهرة والسويس."]],
["الجيش",["بذل جهودًا كبيرة للنهوض بالجيش الذي ضعف في عهد عباس حلمي الأول.","قصّر مدة الخدمة العسكرية إلى <b>عام واحد</b> وجعلها إجبارية على جميع المصريين.","فتح باب <b>الترقي</b> أمام الضباط المصريين."]],
["الثقافة",["اهتم بالآثار المصرية، فجهز <b>مخازن في بولاق</b> لحفظ الآثار."]]],
extra:"<div class='warn'>⚠️ صفحة التعليم وقناة السويس (صلة سعيد بديليسبس وامتياز حفر القناة لمدة ٩٩ سنة) في ملف الدرس مصورة بصورة غير واضحة، لذلك لم أدرج تفاصيلها ولم أبنِ عليها أسئلة. تحتاج هذه الصفحة إلى مراجعة المعلم.</div>",
tl:[["١٨٥٤م","تولى سعيد باشا الحكم بعد وفاة عباس حلمي الأول"],["١٨٦٣م","نهاية فترة حكمه"]],
qs:[["من والد محمد سعيد باشا؟",["عباس بن طوسون","إبراهيم باشا","محمد علي","إسماعيل"],2,"هو محمد سعيد بن «محمد علي»."],
["ماذا أصبح الفلاح بموجب اللائحة السعيدية؟",["مالكًا للأرض","أجيرًا عند الدولة","جنديًا","موظفًا"],0,"بموجبها أصبح الفلاح مالكًا للأرض لأبنائه وحرًا في تصريف محاصيله."],
["إلى كم قصّر سعيد باشا مدة الخدمة العسكرية؟",["عام واحد","ثلاثة أعوام","ستة أعوام","مدى الحياة"],0,"قصّر المدة إلى عام واحد وجعلها إجبارية على جميع المصريين."],
["أي الخطوط استكمل سعيد باشا بعد أن بدأه عباس حلمي الأول؟",["سكة حديد القاهرة – السويس","سكة حديد القاهرة – الإسكندرية","خط التلغراف إلى السودان","ترعة المحمودية"],1,"استكمل خط السكة الحديدية بين القاهرة والإسكندرية الذي بدأه عباس حلمي الأول."],
["لماذا تدل اللائحة السعيدية مع تخفيف الضرائب على اهتمامه بالفلاحين؟",["لأنها منحتهم ملكية الأرض وحرية تصريف المحاصيل وخففت عنهم الأعباء","لأنها أغلقت المدارس","لأنها ألغت الجيش","لأنها أنشأت دار الأوبرا"],0,"منح الفلاح الملكية والتوريث وحرية تصريف المحصول، وخفف الضرائب وتجاوز عن المتأخر، وكلها لإصلاح حاله."]]},
{n:"الخديو إسماعيل",per:"١٨٦٣م – ١٨٧٩م",ic:"🏰",
intro:"هو إسماعيل بن إبراهيم بن «محمد علي». تولى حكم مصر بعد وفاة عمه محمد سعيد باشا. يُعد عهده من أكثر الفترات تقدمًا وعمرانًا في تاريخ مصر الحديث.",
secs:[["الزراعة والري",["زيادة مساحة الأراضي الزراعية.","التوسع في زراعة <b>القطن</b> و<b>قصب السكر</b>.","حفر <b>ترعة الإبراهيمية</b> و<b>ترعة الإسماعيلية</b>."]],
["الصناعة والتجارة",["زيادة مصانع السكر.","إعادة فتح المصانع التي أنشأها «محمد علي»: النسيج والجلود والطوب والزجاج وغيرها.","إنشاء شركة للملاحة التجارية.","تطوير ميناءي <b>الإسكندرية والسويس</b>."]],
["السكك الحديدية والبريد",["إنشاء عدة خطوط للسكك الحديدية.","مد الخطوط التلغرافية بين محافظات مصر، وامتدت إلى <b>السودان</b>.","إنشاء مصلحة <b>البريد المصري</b> ومكاتبها الفرعية في الإسكندرية والقاهرة والأقاليم."]],
["النهضة الثقافية والعلمية",["مضاعفة ميزانية التعليم وإعادة فتح ديوان المدارس والمدارس التي أُغلقت.","إنشاء مدارس جديدة منها <b>مدرسة السنية للبنات</b>.","إرسال البعثات العلمية إلى الدول الأوروبية.","إنشاء <b>دار الأوبرا</b> و<b>دار الرصد بالعباسية</b> (المرصد الفلكي) و<b>الجمعية الجغرافية</b>.","البدء في إنشاء <b>دار الآثار العربية</b> عام ١٨٦٩م (تُعرف حاليًا باسم متحف الفن الإسلامي، وافتُتحت عام ١٩٠٣م في عهد الخديو عباس حلمي الثاني)."]],
["النهضة الصحية والعمرانية",["إنشاء عدة مستشفيات في القاهرة والإسكندرية والأقاليم، وبذل جهود لمكافحة الأوبئة ومقاومة الأمراض.","الاهتمام بتخطيط المدن وتنظيمها وتجميلها، مثل القاهرة: أُعيد تخطيط أحياء بها، وأُنشئ حي <b>عابدين</b>، وأُنشئت قصور مثل <b>قصر عابدين</b> و<b>قصر القبة</b>."]],

["مجلس شورى النواب",["أنشأه الخديو إسماعيل عام <b>١٨٦٦م</b> وكان دوره استشاريًا: له حق مناقشة القوانين والضرائب من دون حق الاعتراض أو إصدار قرارات ملزمة.","أسهم في زيادة الوعي السياسي لدى المصريين وإتاحة حق التعبير عن مشكلاتهم.","هدفت سياسته الخارجية إلى زيادة نفوذ مصر وتعزيز مكانتها الدولية، والاستقلال التام عن الدولة العثمانية."]],
